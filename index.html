<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>عرض الأصناف</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root { --primary:#0056b3; --primary-dark:#00458e; --primary-light:#e6f0ff; --bg:#f5f7fb; --text:#222; --muted:#667085; --border:#e4e7ec; --success:#198754; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; direction:rtl; text-align:right; background:var(--bg); color:var(--text); }
    main { width:100%; max-width:1100px; margin:0 auto; padding:12px 16px 24px; }
    .card { background:#fff; border-radius:12px; padding:12px 14px; box-shadow:0 2px 5px rgba(16,24,40,.05); margin-bottom:14px; }
    .card-title { color:var(--primary); display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:14px; font-weight:700; margin-bottom:8px; }
    .search-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .field-group { display:flex; flex-direction:column; gap:4px; }
    label { color:#555; font-size:11px; }
    input[type="text"], select { width:100%; min-height:38px; padding:7px 9px; border:1px solid #ccc; border-radius:7px; background:#fff; font:inherit; font-size:16px; }
    input[type="text"]:focus, select:focus { outline:none; border-color:var(--primary); box-shadow:0 0 0 2px #c7ddff; }
    button { border:0; border-radius:999px; padding:8px 14px; cursor:pointer; font:inherit; font-size:13px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; gap:6px; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    button:focus-visible,input:focus-visible,select:focus-visible,th:focus-visible,li:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-primary:hover:not(:disabled) { background:var(--primary-dark); }
    .btn-secondary { background:#eee; color:#444; }
    .search-input-wrap { position:relative; }
    .search-input-wrap input { padding-inline-end:36px; }
    .inline-clear-btn { position:absolute; inset-inline-end:4px; top:50%; transform:translateY(-50%); display:none; padding:4px 8px; background:transparent; color:#777; font-size:16px; line-height:1; }
    .inline-clear-btn:hover { background:#eee; color:#222; }
    #autocompleteList { position:absolute; z-index:50; top:calc(100% + 4px); right:0; left:0; display:none; max-height:240px; overflow-y:auto; margin:0; padding:4px 0; list-style:none; border:1px solid #ddd; border-radius:8px; background:#fff; box-shadow:0 4px 10px rgba(0,0,0,.12); }
    #autocompleteList li { padding:8px 12px; cursor:pointer; font-size:13px; }
    #autocompleteList li:hover,#autocompleteList li:focus { background:var(--primary-light); }
    .history-row { display:none; flex-wrap:wrap; align-items:center; gap:6px; margin-top:8px; }
    .history-label { color:#777; font-size:11px; }
    .history-chip { padding:5px 10px; background:var(--primary-light); color:var(--primary); font-size:11px; }
    .search-actions { display:flex; flex-wrap:wrap; justify-content:flex-start; gap:8px; margin-top:10px; }
    .result-count { color:#555; font-size:11px; font-weight:600; }
    .table-wrapper { width:100%; overflow-x:auto; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th,td { padding:8px 10px; border:1px solid #e0e0e0; white-space:nowrap; font-size:12px; }
    th { position:sticky; top:0; z-index:1; cursor:pointer; user-select:none; background:var(--primary); color:#fff; }
    th .arrow { margin-inline-start:4px; font-size:10px; opacity:.75; }
    mark { padding:0 1px; border-radius:2px; background:#fff3a0; }
    .no-results { padding:18px 0; color:var(--danger); text-align:center; }
    #loadMoreBtn { display:none; margin:12px auto 0; background:var(--primary-light); color:var(--primary); }
    #loadStatus { display:none; margin:0 0 8px; padding:8px 12px; border:1px solid #c3e6cb; border-radius:7px; background:#d4edda; color:#287a43; font-size:12px; font-weight:600; }
    #lastModified { display:none; margin:0 0 8px; color:#777; font-size:11px; }
    #refreshBtn { position:fixed; z-index:9999; top:10px; left:10px; min-width:110px; background:var(--success); color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.18); }
    #refreshBtn:hover:not(:disabled) { background:#157347; }
    .refresh-icon { display:inline-block; font-size:15px; }
    #refreshBtn.loading .refresh-icon { animation:spin .8s linear infinite; }
    @keyframes spin { from { transform:rotate(0); } to { transform:rotate(360deg); } }

    @media (max-width:768px) {
      main { padding:10px 8px 18px; }
      .card { margin-bottom:10px; padding:10px; }
      .search-grid { grid-template-columns:1fr; }
      #refreshBtn { top:8px; left:8px; min-width:95px; padding:7px 10px; font-size:12px; }
    }

    /* بطاقات أصناف أوضح للموبايل */
    @media (max-width:640px) {
      body { background:#f3f6fb; }
      main { padding:62px 10px 20px; }
      .card { border-radius:14px; }
      .card-title { margin-bottom:10px; font-size:15px; }
      .search-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:7px; }
      .search-actions button { width:100%; min-height:38px; padding:8px 7px; font-size:12px; }
      .table-wrapper { overflow:visible; }
      #results, #results tbody, #results tr, #results td { display:block; }
      #results { width:100%; margin:0; }
      #results thead { display:none; }
      #results tbody { display:grid; grid-template-columns:1fr; gap:10px; }
      #results tr { position:relative; overflow:hidden; margin:0; padding:0; border:1px solid var(--border); border-radius:14px; background:#fff !important; box-shadow:0 2px 8px rgba(16,24,40,.06); }
      #results tr::before { content:""; position:absolute; top:0; right:0; bottom:0; width:5px; background:var(--warehouse-color,#cbd5e1); }
      #results td { min-height:0; padding:0; border:0; text-align:right; white-space:normal; }
      #results td::before { content:none; }
      #results td[data-label="الصنف"] { padding:14px 16px 9px; color:#101828; font-size:15px; font-weight:800; line-height:1.55; }
      #results td[data-label="المستودع"], #results td[data-label="الكمية"] { display:inline-flex; align-items:center; min-height:31px; margin:0 0 12px; padding:5px 10px; border-radius:999px; font-size:12px; font-weight:650; }
      #results td[data-label="المستودع"] { margin-right:16px; background:#f1f5f9; color:#475467; }
      #results td[data-label="المستودع"]::after { content:"المستودع: " attr(data-value); }
      #results td[data-label="الكمية"] { margin-right:6px; background:#eaf7ee; color:#157347; }
      #results td[data-label="الكمية"]::after { content:"الكمية: " attr(data-value); }
      #results td[data-label="المستودع"], #results td[data-label="الكمية"] { font-size:0; }
      #results td[data-label="المستودع"]::after, #results td[data-label="الكمية"]::after { font-size:12px; }
      .no-results { display:block !important; padding:22px 10px !important; font-size:14px !important; }
      .no-results::after { content:none !important; }
      #loadMoreBtn { width:100%; min-height:44px; margin-top:12px; }
    }

    @media print {
      #refreshBtn,.search-actions,.search-grid,.history-row,#autocompleteList,#loadMoreBtn,#lastModified { display:none !important; }
      body { background:#fff; }
      .card { border:1px solid #ccc; box-shadow:none; }
    }
  </style>
</head>
<body>
  <button id="refreshBtn" type="button" title="تحديث ملف Excel" aria-label="تحديث البيانات" disabled><span class="refresh-icon">↻</span><span class="refresh-text">تحديث</span></button>
  <main>
    <div id="loadStatus"></div>
    <div id="lastModified"></div>
    <section class="card">
      <div class="card-title"><span>البحث في الأصناف</span></div>
      <div class="search-grid">
        <div class="field-group">
          <label for="searchAll">اسم الصنف</label>
          <div class="search-input-wrap">
            <input type="text" id="searchAll" placeholder="ابحث باسم الصنف..." autocomplete="off" role="combobox" aria-expanded="false" aria-owns="autocompleteList" disabled />
            <button type="button" class="inline-clear-btn" id="inlineClearBtn" aria-label="مسح البحث" title="مسح البحث">×</button>
            <ul id="autocompleteList" role="listbox"></ul>
          </div>
        </div>
        <div class="field-group">
          <label for="warehouse">المستودع</label>
          <select id="warehouse" disabled><option value="">كل المستودعات</option></select>
        </div>
      </div>
      <div class="history-row" id="historyRow"><span class="history-label">عمليات بحث سابقة:</span></div>
      <div class="search-actions">
        <button class="btn-secondary" id="clearBtn" type="button" disabled>مسح</button>
        <button class="btn-secondary" id="copyBtn" type="button" disabled>نسخ النتائج</button>
        <button class="btn-secondary" id="printBtn" type="button" disabled>طباعة</button>
        <button class="btn-primary" id="exportBtn" type="button" disabled>تصدير Excel</button>
      </div>
    </section>
    <section class="card">
      <div class="card-title"><span>الأصناف</span><span class="result-count" id="resultCount" aria-live="polite" aria-atomic="true"></span></div>
      <div class="table-wrapper">
        <table id="results">
          <thead><tr>
            <th data-col="warehouse" tabindex="0" role="button">المستودع <span class="arrow"></span></th>
            <th data-col="qty" tabindex="0" role="button">الكمية <span class="arrow"></span></th>
            <th data-col="item" tabindex="0" role="button">الصنف <span class="arrow"></span></th>
          </tr></thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
      <button type="button" id="loadMoreBtn" class="btn-secondary"></button>
    </section>
  </main>

  <script>
    const DATASOURCE_URL = './items.xlsx';
    const STORAGE_KEY = 'itemSearch:lastQuery';
    const HISTORY_KEY = 'itemSearch:history';
    const DISPLAY_STEP = 250;
    const SEARCH_DEBOUNCE_MS = 200;
    let data = [];
    let colMap = { warehouse: 1, item: 2, qty: 3 };
    let warehousesList = [];
    let itemNamesList = [];
    let searchHistory = [];
    let currentSort = { col: null, dir: 1 };
    let displayedCount = DISPLAY_STEP;
    let lastResults = [];
    let pendingWarehouseValue = null;
    let searchDebounceTimer = null;
    let autocompleteVisible = false;

    const searchAllEl = document.getElementById('searchAll');
    const inlineClearBtn = document.getElementById('inlineClearBtn');
    const autocompleteEl = document.getElementById('autocompleteList');
    const warehouseSelectEl = document.getElementById('warehouse');
    const historyRowEl = document.getElementById('historyRow');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const printBtn = document.getElementById('printBtn');
    const exportBtn = document.getElementById('exportBtn');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const refreshBtn = document.getElementById('refreshBtn');
    const refreshTextEl = refreshBtn.querySelector('.refresh-text');
    const resultCountEl = document.getElementById('resultCount');
    const resultsBodyEl = document.getElementById('resultsBody');
    const loadStatusEl = document.getElementById('loadStatus');
    const lastModifiedEl = document.getElementById('lastModified');

    function normalizeArabic(text) {
      if (!text) return '';
      return String(text)
        .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '')
        .replace(/ـ/g, '')
        .replace(/[أإآ]/g, 'ا')
        .replace(/ى/g, 'ي')
        .replace(/ة/g, 'ه')
        .trim().toLowerCase();
    }

    function buildFlexibleArabicPattern(word) {
      const map = { 'ا':'[ا  إآ]', 'ي':'[يى]', 'ه':'[هة]' };
      return Array.from(word).map(ch => map[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('') + '[\u064B-\u065F\u0670\u06D6-\u06EDـ]*';
    }

    function detectColumns(allRows) {
      const headerKeywords = { warehouse:['المستودع','المخزن','warehouse'], item:['الصنف','الصنف','المنتج','item','product'], qty:['الكمية','الرصيد','qty','quantity'] };
      const maxHeaderScanRows = Math.min(8, allRows.length);
      for (let r = 0; r < maxHeaderScanRows; r++) {
        const found = {};
        (allRows[r] || []).forEach((cell, colIndex) => {
          const cellText = String(cell || '').trim().toLowerCase();
          if (!cellText) return;
          Object.keys(headerKeywords).forEach(key => {
            if (found[key] !== undefined) return;
            if (headerKeywords[key].some(kw => cellText.includes(kw))) found[key] = colIndex;
          });
        });
        if (found.warehouse !== undefined && found.item !== undefined && found.qty !== undefined) return { colMap: found, dataStartIndex: r + 1 };
      }
      return { colMap: { warehouse:1, item:2, qty:3 }, dataStartIndex:3 };
    }

    function validateColumns(rows, map) {
      const sampleSize = Math.min(30, rows.length);
      let warehouseOk = false, itemOk = false;
      for (let i = 0; i < sampleSize; i++) {
        const row = rows[i] || [];
        if (!warehouseOk && String(row[map.warehouse] || '').trim()) warehouseOk = true;
        if (!itemOk && String(row[map.item] || '').trim()) itemOk = true;
        if (warehouseOk && itemOk) break;
      }
      return warehouseOk && itemOk;
    }

    function formatQty(value) {
      const num = Number(value);
      return Number.isNaN(num) ? String(value ?? '') : num.toLocaleString('en-US', { maximumFractionDigits:0 });
    }

    function getColorForWarehouse(name) {
      if (!name) return '#cbd5e1';
      const colors = ['#7cb7ff','#86d39b','#ffbf7a','#d3a4ff','#79d9e8','#f6a6a6','#c6d88a'];
      let hash = 0;
      for (let i = 0; i < String(name).length; i++) hash = String(name).charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }

    function setControlsEnabled(enabled) {
      [searchAllEl, warehouseSelectEl, clearBtn].forEach(el => el.disabled = !enabled);
      if (!enabled) [exportBtn, copyBtn, printBtn].forEach(el => el.disabled = true);
    }

    function setRefreshLoading(isLoading) {
      refreshBtn.disabled = isLoading;
      refreshBtn.classList.toggle('loading', isLoading);
      refreshTextEl.textContent = isLoading ? 'جاري التحديث' : 'تحديث';
      refreshBtn.querySelector('.refresh-icon').textContent = isLoading ? '↻' : '↻';
    }

    function showStatus(message, isError = false) {
      loadStatusEl.textContent = message;
      loadStatusEl.style.display = 'block';
      loadStatusEl.style.color = isError ? '#b42318' : '#287a43';
      loadStatusEl.style.background = isError ? '#fef3f2' : '#d4edda';
      loadStatusEl.style.borderColor = isError ? '#fecdca' : '#c3e6cb';
    }

    async function loadExcel() {
      const hadPreviousData = data.length > 0;
      setRefreshLoading(true);
      if (!hadPreviousData) setControlsEnabled(false);
      showStatus('جاري تحميل بيانات الأصناف...');
      try {
        const separator = DATASOURCE_URL.includes('?') ? '&' : '?';
        const response = await fetch(`${DATASOURCE_URL}${separator}v=${Date.now()}`, { cache:'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const lastMod = response.headers.get('Last-Modified');
        lastModifiedEl.textContent = `آخر تحديث: ${lastMod ? new Date(lastMod).toLocaleString('ar') : new Date().toLocaleString('ar')}`;
        lastModifiedEl.style.display = 'block';
        const workbook = XLSX.read(new Uint8Array(await response.arrayBuffer()), { type:'array' });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const allRows = XLSX.utils.sheet_to_json(sheet, { header:1 });
        const detection = detectColumns(allRows);
        const rows = allRows.slice(detection.dataStartIndex).filter(row => row && row.some(value => String(value ?? '').trim()));
        if (!validateColumns(rows, detection.colMap)) throw new Error('COLUMNS_NOT_FOUND');
        colMap = detection.colMap;
        data = rows;
        buildWarehousesList();
        buildItemNamesIndex();
        showStatus(`تم تحميل ${data.length.toLocaleString('en-US')} سجلًا بنجاح.`);
        setControlsEnabled(true);
        resetDisplayCount();
        hideAutocomplete();
        search();
      } catch (error) {
        console.error(error);
        showStatus(error.message === 'COLUMNS_NOT_FOUND' ? 'تعذر تحديد أعمدة المستودع والصنف والكمية في ملف Excel.' : 'تعذر تحميل ملف Excel. تأكد من وجود items.xlsx في نفس مجلد الصفحة.', true);
        setControlsEnabled(data.length > 0);
      } finally {
        setRefreshLoading(false);
      }
    }

    function buildWarehousesList() {
      const set = new Set();
      data.forEach(row => { const value = String(row[colMap.warehouse] ?? '').trim(); if (value) set.add(value); });
      warehousesList = Array.from(set).sort((a,b) => a.localeCompare(b, 'ar'));
      const valueToRestore = pendingWarehouseValue || warehouseSelectEl.value;
      warehouseSelectEl.innerHTML = '<option value="">كل المستودعات</option>' + warehousesList.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`).join('');
      if (valueToRestore && warehousesList.includes(valueToRestore)) warehouseSelectEl.value = valueToRestore;
      pendingWarehouseValue = null;
    }

    function buildItemNamesIndex() {
      const set = new Set();
      data.forEach(row => { const value = String(row[colMap.item] ?? '').trim(); if (value) set.add(value); });
      itemNamesList = Array.from(set).map(raw => ({ raw, norm:normalizeArabic(raw) }));
    }

    function saveQuery() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ searchAll:searchAllEl.value, warehouse:warehouseSelectEl.value })); } catch (_) {} }
    function restoreLastQuery() { try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (saved?.searchAll) searchAllEl.value = saved.searchAll; if (saved?.warehouse) pendingWarehouseValue = saved.warehouse; } catch (_) {} }
    function clearQuery() { searchAllEl.value = ''; warehouseSelectEl.value = ''; toggleInlineClearBtn(); hideAutocomplete(); try { localStorage.removeItem(STORAGE_KEY); } catch (_) {} resetDisplayCount(); search(); searchAllEl.focus(); }
    function escapeHtml(str) { return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function highlightWords(text, words) { const safe = escapeHtml(text); const cleanWords = words.filter(Boolean); if (!cleanWords.length) return safe; const patterns = cleanWords.slice().sort((a,b) => b.length-a.length).map(buildFlexibleArabicPattern); return safe.replace(new RegExp(`(${patterns.join('|')})`, 'gi'), '<mark>$1</mark>'); }
    function resetDisplayCount() { displayedCount = DISPLAY_STEP; }

    function getFilteredResults() {
      if (!data.length) return { results:[], words:[] };
      const searchNorm = normalizeArabic(searchAllEl.value.trim());
      const words = searchNorm.split(/\s+/).filter(Boolean);
      const warehouseFilter = warehouseSelectEl.value;
      const scored = [];
      data.forEach(row => {
        const warehouse = String(row[colMap.warehouse] ?? '').trim();
        if (!warehouse || (warehouseFilter && warehouse !== warehouseFilter)) return;
        const item = String(row[colMap.item] ?? '');
        const itemNorm = normalizeArabic(item);
        let score = 1;
        if (words.length) {
          if (!words.every(word => itemNorm.includes(word))) return;
          score = itemNorm === searchNorm ? 4 : itemNorm.startsWith(searchNorm) ? 3 : words.every(word => itemNorm.split(/\s+/).some(token => token.startsWith(word))) ? 2 : 1;
        }
        scored.push({ row, score });
      });
      if (currentSort.col) {
        scored.sort((a,b) => {
          let aValue = a.row[colMap[currentSort.col]], bValue = b.row[colMap[currentSort.col]];
          if (currentSort.col === 'qty') return (Number(aValue) - Number(bValue)) * currentSort.dir;
          return String(aValue ?? '').localeCompare(String(bValue ?? ''), 'ar') * currentSort.dir;
        });
      } else {
        scored.sort((a,b) => words.length && b.score !== a.score ? b.score-a.score : String(a.row[colMap.item] ?? '').localeCompare(String(b.row[colMap.item] ?? ''), 'ar'));
      }
      return { results:scored.map(entry => entry.row), words };
    }

    function updateResultActionsState(total) {
      const disabled = !data.length || total === 0;
      [exportBtn, copyBtn, printBtn].forEach(el => el.disabled = disabled);
      exportBtn.textContent = total ? `تصدير ${total.toLocaleString('en-US')} Excel` : 'تصدير Excel';
    }

    function search() {
      if (!data.length) { resultsBodyEl.innerHTML = '<tr><td colspan="3" class="no-results">لا توجد بيانات للعرض.</td></tr>'; resultCountEl.textContent = ''; loadMoreBtn.style.display = 'none'; updateResultActionsState(0); return; }
      const { results, words } = getFilteredResults();
      lastResults = results;
      const total = results.length;
      updateResultActionsState(total);
      resultsBodyEl.innerHTML = '';
      if (!total) { resultCountEl.textContent = 'لا توجد نتائج'; resultsBodyEl.innerHTML = '<tr><td colspan="3" class="no-results">لا توجد أصناف مطابقة للبحث.</td></tr>'; loadMoreBtn.style.display = 'none'; return; }
      const shown = Math.min(displayedCount, total);
      resultCountEl.textContent = `عرض ${shown.toLocaleString('en-US')} من ${total.toLocaleString('en-US')}`;
      const fragment = document.createDocumentFragment();
      results.slice(0, displayedCount).forEach(row => {
        const warehouse = String(row[colMap.warehouse] ?? '');
        const item = String(row[colMap.item] ?? '');
        const qty = formatQty(row[colMap.qty]);
        const tr = document.createElement('tr');
        tr.style.setProperty('--warehouse-color', getColorForWarehouse(warehouse));
        tr.innerHTML = `<td data-label="الصنف">${highlightWords(item, words)}</td><td data-label="المستودع" data-value="${escapeHtml(warehouse)}">${escapeHtml(warehouse)}</td><td data-label="الكمية" data-value="${escapeHtml(qty)}">${escapeHtml(qty)}</td>`;
        fragment.appendChild(tr);
      });
      resultsBodyEl.appendChild(fragment);
      if (total > displayedCount) { loadMoreBtn.style.display = 'inline-flex'; loadMoreBtn.textContent = `عرض المزيد (${shown.toLocaleString('en-US')} من ${total.toLocaleString('en-US')})`; } else loadMoreBtn.style.display = 'none';
    }

    function exportResults() { if (!lastResults.length) return; const rows = [['المستودع','الكمية','الصنف'], ...lastResults.map(row => [row[colMap.warehouse], row[colMap.qty], row[colMap.item]])]; const worksheet = XLSX.utils.aoa_to_sheet(rows); const workbook = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(workbook, worksheet, 'الأصناف'); XLSX.writeFile(workbook, 'نتائج_الأصناف.xlsx'); }
    function showTempMessage(button, message) { const original = button.dataset.originalText || button.textContent; button.dataset.originalText = original; button.textContent = message; setTimeout(() => button.textContent = original, 1500); }
    function copyResults() { if (!lastResults.length) return; const text = lastResults.map(row => `${row[colMap.warehouse]}\t${formatQty(row[colMap.qty])}\t${row[colMap.item]}`).join('\n'); if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(() => showTempMessage(copyBtn, 'تم النسخ')).catch(() => showTempMessage(copyBtn, 'تعذر النسخ')); else showTempMessage(copyBtn, 'تعذر النسخ'); }
    function printResults() { if (!lastResults.length) return; const saved = displayedCount; displayedCount = lastResults.length; search(); const restore = () => { displayedCount = saved; search(); window.removeEventListener('afterprint', restore); }; window.addEventListener('afterprint', restore); window.print(); }
    function toggleInlineClearBtn() { inlineClearBtn.style.display = searchAllEl.value ? 'flex' : 'none'; }
    function hideAutocomplete() { autocompleteEl.style.display = 'none'; autocompleteEl.innerHTML = ''; autocompleteVisible = false; searchAllEl.setAttribute('aria-expanded','false'); }
    function renderAutocomplete(list) { if (!list.length) return hideAutocomplete(); autocompleteEl.innerHTML = list.map(name => `<li role="option" tabindex="-1">${escapeHtml(name)}</li>`).join(''); autocompleteEl.style.display = 'block'; autocompleteVisible = true; searchAllEl.setAttribute('aria-expanded','true'); }
    function updateAutocomplete() { const raw = searchAllEl.value.trim(); if (!raw || !itemNamesList.length) return hideAutocomplete(); const words = normalizeArabic(raw).split(/\s+/).filter(Boolean); const matches = []; for (const entry of itemNamesList) { if (matches.length === 8) break; if (words.every(word => entry.norm.includes(word))) matches.push(entry.raw); } renderAutocomplete(matches); }
    function loadHistory() { try { searchHistory = JSON.parse(localStorage.getItem(HISTORY_KEY)); if (!Array.isArray(searchHistory)) searchHistory = []; } catch (_) { searchHistory = []; } renderHistory(); }
    function saveSearchToHistory(term) { const value = term.trim(); if (!value) return; searchHistory = [value, ...searchHistory.filter(item => item !== value)].slice(0,5); try { localStorage.setItem(HISTORY_KEY, JSON.stringify(searchHistory)); } catch (_) {} renderHistory(); }
    function renderHistory() { if (!searchHistory.length) { historyRowEl.style.display = 'none'; return; } historyRowEl.style.display = 'flex'; historyRowEl.innerHTML = '<span class="history-label">عمليات بحث سابقة:</span>' + searchHistory.map(term => `<button type="button" class="history-chip">${escapeHtml(term)}</button>`).join(''); }

    searchAllEl.addEventListener('input', () => { saveQuery(); toggleInlineClearBtn(); clearTimeout(searchDebounceTimer); searchDebounceTimer = setTimeout(() => { resetDisplayCount(); updateAutocomplete(); search(); }, SEARCH_DEBOUNCE_MS); });
    searchAllEl.addEventListener('keydown', event => { if (event.key === 'Enter') { clearTimeout(searchDebounceTimer); resetDisplayCount(); hideAutocomplete(); search(); saveSearchToHistory(searchAllEl.value); } else if (event.key === 'Escape') autocompleteVisible ? hideAutocomplete() : clearQuery(); });
    inlineClearBtn.addEventListener('click', () => { searchAllEl.value = ''; toggleInlineClearBtn(); saveQuery(); hideAutocomplete(); resetDisplayCount(); search(); searchAllEl.focus(); });
    autocompleteEl.addEventListener('click', event => { const li = event.target.closest('li'); if (!li) return; searchAllEl.value = li.textContent; toggleInlineClearBtn(); saveQuery(); hideAutocomplete(); resetDisplayCount(); search(); saveSearchToHistory(searchAllEl.value); searchAllEl.focus(); });
    document.addEventListener('click', event => { if (!autocompleteEl.contains(event.target) && event.target !== searchAllEl) hideAutocomplete(); });
    warehouseSelectEl.addEventListener('change', () => { saveQuery(); resetDisplayCount(); search(); });
    historyRowEl.addEventListener('click', event => { const chip = event.target.closest('.history-chip'); if (!chip) return; searchAllEl.value = chip.textContent; toggleInlineClearBtn(); saveQuery(); hideAutocomplete(); resetDisplayCount(); search(); });
    clearBtn.addEventListener('click', clearQuery);
    exportBtn.addEventListener('click', exportResults);
    copyBtn.addEventListener('click', copyResults);
    printBtn.addEventListener('click', printResults);
    loadMoreBtn.addEventListener('click', () => { displayedCount += DISPLAY_STEP; search(); });
    refreshBtn.addEventListener('click', loadExcel);
    document.querySelectorAll('#results th').forEach(th => {
      const triggerSort = () => { const col = th.getAttribute('data-col'); if (currentSort.col === col) currentSort.dir *= -1; else { currentSort.col = col; currentSort.dir = 1; } document.querySelectorAll('#results th .arrow').forEach(arrow => arrow.textContent = ''); th.querySelector('.arrow').textContent = currentSort.dir === 1 ? '▲' : '▼'; search(); };
      th.addEventListener('click', triggerSort);
      th.addEventListener('keydown', event => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); triggerSort(); } });
    });
    restoreLastQuery();
    toggleInlineClearBtn();
    loadHistory();
    loadExcel();
  </script>
</body>
</html>
