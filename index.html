<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>البحث في الأصناف</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    :root{--primary:#0056b3;--primary-light:#e6f0ff;--bg:#f5f7fb;--text:#222}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;direction:rtl;text-align:right;background:var(--bg);color:var(--text)}
    main{padding:12px 16px 24px;max-width:1100px;margin:0 auto;width:100%}
    .card{background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 2px 4px rgba(0,0,0,.04);margin-bottom:14px}
    .card-title{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--primary);display:flex;align-items:center;justify-content:space-between;gap:8px}
    .search-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .field-group{display:flex;flex-direction:column;gap:3px}
    label{font-size:11px;color:#555}
    input[type="text"],select{padding:6px 8px;border-radius:6px;border:1px solid #ccc;font-size:16px;width:100%;background:#fff;font-family:inherit}
    input[type="text"]:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 1px #c7ddff}
    button:focus-visible,input:focus-visible,select:focus-visible,th:focus-visible,li:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
    .search-input-wrap{position:relative}
    .search-input-wrap input{padding-inline-end:32px}
    .inline-clear-btn{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:15px;color:#888;cursor:pointer;padding:4px 7px;border-radius:50%;display:none;line-height:1}
    .inline-clear-btn:hover{background:#eee;color:#333}
    #autocompleteList{position:absolute;top:calc(100% + 4px);right:0;left:0;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.12);list-style:none;margin:0;padding:4px 0;max-height:240px;overflow-y:auto;z-index:50;display:none}
    #autocompleteList li{padding:7px 12px;font-size:13px;cursor:pointer}
    #autocompleteList li:hover,#autocompleteList li:focus{background:var(--primary-light)}
    .history-row{margin-top:8px;display:none;flex-wrap:wrap;gap:6px;align-items:center}
    .history-row .history-label{font-size:11px;color:#777}
    .history-chip{background:var(--primary-light);color:var(--primary);border:none;border-radius:999px;padding:4px 10px;font-size:11px;cursor:pointer}
    .history-chip:hover{background:#cfe3ff}
    .search-actions{margin-top:8px;display:flex;justify-content:flex-start;gap:8px;flex-wrap:wrap}
    button{border:none;cursor:pointer;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-secondary{background:#eee;color:#444}
    button:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary:active,.btn-secondary:active{transform:translateY(1px)}
    .result-count{font-size:11px;color:#555;font-weight:500}
    .table-wrapper{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* العرض يتحدد تلقائيًا حسب أطول محتوى في كل عمود */
    table{border-collapse:collapse;margin-top:8px;width:max-content;min-width:100%;table-layout:auto}
    th,td{border:1px solid #e0e0e0;padding:6px 10px;font-size:12px;white-space:nowrap;width:max-content}
    th{background:var(--primary);color:#fff;position:sticky;top:0;z-index:1;cursor:pointer;user-select:none}
    th .arrow{font-size:10px;margin-inline-start:4px;opacity:.7}
    mark{background:#fff3a0;padding:0 1px;border-radius:2px}
    .no-results{text-align:center;padding:16px 0;color:#c00}
    #loadMoreBtn{display:none;margin:12px auto 0;background:var(--primary-light);color:var(--primary)}
    #loadStatus{font-size:12px;font-weight:600;color:#28a745;padding:8px 12px;background:#d4edda;border-radius:6px;border:1px solid #c3e6cb;margin-top:8px}
    #lastModified{font-size:11px;color:#777;margin-top:4px}
    #refreshBtn{position:fixed;top:10px;left:10px;z-index:9999;background:#198754;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18);min-width:110px}
    #refreshBtn:hover:not(:disabled){background:#157347}
    #refreshBtn.loading{pointer-events:none}
    .refresh-icon{display:inline-block;font-size:15px}
    #refreshBtn.loading .refresh-icon{animation:spin .8s linear infinite}
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
    @media(max-width:768px){main{padding:10px 8px 18px}.card{padding:10px;margin-bottom:10px}.search-grid{grid-template-columns:1fr}table{font-size:11px}th,td{padding:5px 6px}#refreshBtn{top:8px;left:8px;padding:6px 10px;font-size:12px;min-width:95px}}
    /* على الموبايل يبقى الجدول تلقائي العرض، ويمكن تمريره أفقيًا عند طول اسم الصنف */
    @media(max-width:640px){.table-wrapper{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}#results{width:max-content;min-width:100%;table-layout:auto}#results th,#results td{white-space:nowrap;width:max-content;padding:7px 8px;font-size:12px;text-align:right}#results td[data-label="الصنف"]{min-width:max-content}#results td[data-label="المستودع"]{min-width:max-content}#results td[data-label="الكمية"]{min-width:max-content;text-align:center}#results td mark{white-space:nowrap}}
    @media print{#refreshBtn,.search-actions,.search-grid,.history-row,#autocompleteList,#loadMoreBtn,#lastModified{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}}
  </style>
</head>
<body>
  <button id="refreshBtn" type="button" title="تحديث ملف Excel" aria-label="تحديث البيانات" disabled><span class="refresh-icon">↻</span><span class="refresh-text">تحديث</span></button>
  <main>
    <div id="loadStatus" style="display:none"></div>
    <div id="lastModified" style="display:none"></div>
    <section class="card">
      <div class="card-title"><div>البحث في الأصناف</div></div>
      <div class="search-grid">
        <div class="field-group"><label for="searchAll">اسم الصنف</label><div class="search-input-wrap"><input type="text" id="searchAll" placeholder="ابحث باسم الصنف..." autocomplete="off" role="combobox" aria-expanded="false" aria-owns="autocompleteList" disabled><button type="button" class="inline-clear-btn" id="inlineClearBtn" aria-label="مسح البحث" title="مسح البحث">×</button><ul id="autocompleteList" role="listbox"></ul></div></div>
        <div class="field-group"><label for="warehouse">المستودع</label><select id="warehouse" disabled><option value="">كل المستودعات</option></select></div>
      </div>
      <div class="history-row" id="historyRow"><span class="history-label">عمليات بحث سابقة:</span></div>
      <div class="search-actions"><button class="btn-secondary" id="clearBtn" type="button" disabled>مسح</button><button class="btn-secondary" id="copyBtn" type="button" disabled>نسخ النتائج</button><button class="btn-secondary" id="printBtn" type="button" disabled>طباعة</button><button class="btn-primary" id="exportBtn" type="button" disabled>تصدير Excel</button></div>
    </section>
    <section class="card">
      <div class="card-title"><span>الأصناف</span><span class="result-count" id="resultCount" aria-live="polite" aria-atomic="true"></span></div>
      <div class="table-wrapper"><table id="results"><thead><tr><th data-col="warehouse" tabindex="0" role="button">المستودع <span class="arrow"></span></th><th data-col="qty" tabindex="0" role="button">الكمية <span class="arrow"></span></th><th data-col="item" tabindex="0" role="button">الصنف <span class="arrow"></span></th></tr></thead><tbody id="resultsBody"></tbody></table></div>
      <button type="button" id="loadMoreBtn" class="btn-secondary"></button>
    </section>
  </main>
  <script>
    const DATA_SOURCE_URL='./items.xlsx';
    const STORAGE_KEY='itemSearch:lastQuery';
    const HISTORY_KEY='itemSearch:history';
    const DISPLAY_STEP=250;
    const SEARCH_DEBOUNCE_MS=200;
    let data=[];
    let colMap={warehouse:1,item:2,qty:3};
    let warehousesList=[];
    let itemNamesList=[];
    let searchHistory=[];
    let currentSort={col:null,dir:1};
    let displayedCount=DISPLAY_STEP;
    let lastResults=[];
    let pendingWarehouseValue=null;
    let searchDebounceTimer=null;
    let autocompleteVisible=false;
    const searchAllEl=document.getElementById('searchAll');
    const inlineClearBtn=document.getElementById('inlineClearBtn');
    const autocompleteEl=document.getElementById('autocompleteList');
    const warehouseSelectEl=document.getElementById('warehouse');
    const historyRowEl=document.getElementById('historyRow');
    const clearBtn=document.getElementById('clearBtn');
    const copyBtn=document.getElementById('copyBtn');
    const printBtn=document.getElementById('printBtn');
    const exportBtn=document.getElementById('exportBtn');
    const loadMoreBtn=document.getElementById('loadMoreBtn');
    const refreshBtn=document.getElementById('refreshBtn');
    const refreshTextEl=refreshBtn.querySelector('.refresh-text');
    const resultCountEl=document.getElementById('resultCount');
    const resultsBodyEl=document.getElementById('resultsBody');
    const loadStatusEl=document.getElementById('loadStatus');
    const lastModifiedEl=document.getElementById('lastModified');
    function normalizeArabic(text){if(!text)return '';let t=text.toString();t=t.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,'');t=t.replace(/ـ/g,'');t=t.replace(/[أإآ]/g,'ا');t=t.replace(/ى/g,'ي');t=t.replace(/ة/g,'ه').trim();return t.toLowerCase()}
    function buildFlexibleArabicPattern(normalizedWord){const map={'ا':'[ا  إآ]','ي':'[يى]','ه':'[هة]'};let pattern='';for(const ch of normalizedWord){const piece=map[ch]||ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');pattern+=piece}return pattern+'[\u064B-\u065F\u0670\u06D6-\u06EDـ]*'}
    function detectColumns(allRows){const headerKeywords={warehouse:['المستودع','المخزن','warehouse'],item:['الصنف','المنتج','item','product'],qty:['الكمية','الرصيد','qty','quantity']};const maxHeaderScanRows=Math.min(8,allRows.length);for(let r=0;r<maxHeaderScanRows;r++){const row=allRows[r]||[];const found={};row.forEach((cell,colIndex)=>{const cellText=String(cell??'').trim().toLowerCase();if(!cellText)return;Object.keys(headerKeywords).forEach(key=>{if(found[key]!==undefined)return;if(headerKeywords[key].some(kw=>cellText.includes(kw)))found[key]=colIndex})});if(found.warehouse!==undefined&&found.item!==undefined&&found.qty!==undefined)return{colMap:found,dataStartIndex:r+1,detected:true}}return{colMap:{warehouse:1,item:2,qty:3},dataStartIndex:3,detected:false}}
    function validateColumns(rows,map){const sampleSize=Math.min(30,rows.length);let warehouseOk=false,itemOk=false;for(let i=0;i<sampleSize;i++){const row=rows[i]||[];if(!warehouseOk&&String(row[map.warehouse]??'').trim())warehouseOk=true;if(!itemOk&&String(row[map.item]??'').trim())itemOk=true;if(warehouseOk&&itemOk)break}return warehouseOk&&itemOk}
    function formatQty(value){const num=Number(value);if(Number.isNaN(num))return String(value??'');return num.toLocaleString('en-US',{maximumFractionDigits:0})}
    function getColorForWarehouse(name){if(!name)return '#fff';const lower=String(name).toLowerCase();if(lower.includes('رئيس'))return '#d0e7ff';const colors=['#e8f5e9','#fff3e0','#f3e5f5','#e0f7fa','#fbe9e7','#ede7f6','#f9fbe7'];let hash=0;for(let i=0;i<String(name).length;i++)hash=String(name).charCodeAt(i)+((hash<<5)-hash);return colors[Math.abs(hash)%colors.length]}
    function setControlsEnabled(enabled){[searchAllEl,warehouseSelectEl,clearBtn].forEach(element=>element.disabled=!enabled);if(!enabled){exportBtn.disabled=true;copyBtn.disabled=true;printBtn.disabled=true}}
    function setRefreshLoading(isLoading){refreshBtn.disabled=isLoading;refreshBtn.classList.toggle('loading',isLoading);if(isLoading){refreshTextEl.textContent='جاري التحديث';refreshBtn.querySelector('.refresh-icon').textContent='↻'}else{refreshTextEl.textContent='تحديث';refreshBtn.querySelector('.refresh-icon').textContent='↻'}}
    function showStatus(message,isError=false){loadStatusEl.textContent=message;loadStatusEl.style.display='block';if(isError){loadStatusEl.style.color='#dc3545';loadStatusEl.style.background='#f8d7da';loadStatusEl.style.borderColor='#f5c6cb'}else{loadStatusEl.style.color='#28a745';loadStatusEl.style.background='#d4edda';loadStatusEl.style.borderColor='#c3e6cb'}}
    async function loadExcel(){const hadPreviousData=data.length>0;setRefreshLoading(true);if(!hadPreviousData)setControlsEnabled(false);showStatus('جاري تحميل البيانات...',false);try{const separator=DATA_SOURCE_URL.includes('?')?'&':'?';const freshUrl=DATA_SOURCE_URL+separator+'v='+Date.now();const response=await fetch(freshUrl,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const lastMod=response.headers.get('Last-Modified');lastModifiedEl.textContent=lastMod?'آخر تحديث: '+new Date(lastMod).toLocaleString('ar'):'آخر تحديث: '+new Date().toLocaleString('ar');lastModifiedEl.style.display='block';const arrayBuffer=await response.arrayBuffer();const workbook=XLSX.read(new Uint8Array(arrayBuffer),{type:'array'});const sheet=workbook.Sheets[workbook.SheetNames[0]];const allRows=XLSX.utils.sheet_to_json(sheet,{header:1});const detection=detectColumns(allRows);const rows=allRows.slice(detection.dataStartIndex);if(!validateColumns(rows,detection.colMap))throw new Error('COLUMNS_NOT_FOUND');colMap=detection.colMap;data=rows;buildWarehousesList();buildItemNamesIndex();showStatus('تم تحميل '+data.length.toLocaleString('en-US')+' سجلًا بنجاح.',false);setControlsEnabled(true);resetDisplayCount();hideAutocomplete();search()}catch(error){console.error(error);if(error&&error.message==='COLUMNS_NOT_FOUND')showStatus('تعذر تحديد أعمدة المستودع والصنف والكمية في ملف Excel.',true);else showStatus('تعذر تحميل ملف Excel. تأكد من وجود الملف في نفس مجلد الصفحة.',true);setControlsEnabled(data.length>0)}finally{setRefreshLoading(false)}}
    function buildWarehousesList(){const set=new Set();data.forEach(row=>{const w=String(row[colMap.warehouse]??'').trim();if(w)set.add(w)});warehousesList=Array.from(set).sort((a,b)=>a.localeCompare(b,'ar'));const valueToRestore=pendingWarehouseValue||warehouseSelectEl.value;warehouseSelectEl.innerHTML='<option value="">كل المستودعات</option>'+warehousesList.map(w=>'<option value="'+escapeHtml(w)+'">'+escapeHtml(w)+'</option>').join('');if(valueToRestore&&warehousesList.includes(valueToRestore))warehouseSelectEl.value=valueToRestore;pendingWarehouseValue=null}
    function buildItemNamesIndex(){const set=new Set();data.forEach(row=>{const name=String(row[colMap.item]??'').trim();if(name)set.add(name)});itemNamesList=Array.from(set).map(name=>({raw:name,norm:normalizeArabic(name)}))}
    function saveQuery(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({searchAll:searchAllEl.value,warehouse:warehouseSelectEl.value}))}catch(error){}}
    function restoreLastQuery(){try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY));if(saved){if(saved.searchAll)searchAllEl.value=saved.searchAll;if(saved.warehouse)pendingWarehouseValue=saved.warehouse}}catch(error){}}
    function clearQuery(){searchAllEl.value='';warehouseSelectEl.value='';toggleInlineClearBtn();hideAutocomplete();try{localStorage.removeItem(STORAGE_KEY)}catch(error){}resetDisplayCount();search();searchAllEl.focus()}
    function escapeHtml(str){return String(str??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
    function highlightWords(text,words){const safe=escapeHtml(text);const cleanWords=words.filter(Boolean);if(!cleanWords.length)return safe;const patterns=cleanWords.slice().sort((a,b)=>b.length-a.length).map(w=>buildFlexibleArabicPattern(w));const regex=new RegExp('('+patterns.join('|')+')','gi');return safe.replace(regex,'<mark>$1</mark>')}
    function resetDisplayCount(){displayedCount=DISPLAY_STEP}
    function getFilteredResults(){if(data.length===0)return{results:[],words:[]};const searchRaw=searchAllEl.value.trim();const searchNorm=normalizeArabic(searchRaw);const words=searchNorm.split(/\s+/).filter(Boolean);const warehouseFilter=warehouseSelectEl.value;const scored=[];data.forEach(row=>{const warehouse=String(row[colMap.warehouse]??'').trim();if(!warehouse)return;if(warehouseFilter&&warehouse!==warehouseFilter)return;const itemRaw=String(row[colMap.item]??'');const itemNorm=normalizeArabic(itemRaw);let score=1;if(words.length>0){const allMatch=words.every(w=>itemNorm.includes(w));if(!allMatch)return;if(itemNorm===searchNorm)score=4;else if(itemNorm.startsWith(searchNorm))score=3;else{const tokens=itemNorm.split(/\s+/);const allStartToken=words.every(w=>tokens.some(tok=>tok.startsWith(w)));score=allStartToken?2:1}}scored.push({row,score})});if(currentSort.col){scored.sort((a,b)=>{let valueA=a.row[colMap[currentSort.col]];let valueB=b.row[colMap[currentSort.col]];if(currentSort.col==='qty'){valueA=Number(valueA)||0;valueB=Number(valueB)||0;return(valueA-valueB)*currentSort.dir}valueA=String(valueA??'');valueB=String(valueB??'');return valueA.localeCompare(valueB,'ar')*currentSort.dir})}else if(words.length>0){scored.sort((a,b)=>{if(b.score!==a.score)return b.score-a.score;return String(a.row[colMap.item]??'').localeCompare(String(b.row[colMap.item]??''),'ar')})}else{scored.sort((a,b)=>String(a.row[colMap.item]??'').localeCompare(String(b.row[colMap.item]??''),'ar'))}return{results:scored.map(s=>s.row),words}}
    function updateResultActionsState(total){const disable=data.length===0||total===0;exportBtn.disabled=disable;copyBtn.disabled=disable;printBtn.disabled=disable;exportBtn.textContent=total?total.toLocaleString('en-US')+' تصدير Excel':'تصدير Excel'}
    function search(){if(data.length===0){resultsBodyEl.innerHTML='<tr><td colspan="3" class="no-results">لا توجد بيانات للعرض.</td></tr>';resultCountEl.textContent='';loadMoreBtn.style.display='none';updateResultActionsState(0);return}const{results,words}=getFilteredResults();lastResults=results;const total=results.length;updateResultActionsState(total);resultsBodyEl.innerHTML='';if(total===0){resultCountEl.textContent='لا توجد نتائج';resultsBodyEl.innerHTML='<tr><td colspan="3" class="no-results">لا توجد أصناف مطابقة للبحث.</td></tr>';loadMoreBtn.style.display='none';return}const shown=Math.min(displayedCount,total);resultCountEl.textContent='عرض '+shown.toLocaleString('en-US')+' من '+total.toLocaleString('en-US');const toShow=results.slice(0,displayedCount);const fragment=document.createDocumentFragment();toShow.forEach(row=>{const warehouse=String(row[colMap.warehouse]??'');const itemName=String(row[colMap.item]??'');const qty=formatQty(row[colMap.qty]);const tr=document.createElement('tr');tr.style.backgroundColor=getColorForWarehouse(warehouse);tr.innerHTML='<td data-label="المستودع">'+escapeHtml(warehouse)+'</td><td data-label="الكمية">'+escapeHtml(qty)+'</td><td data-label="الصنف">'+highlightWords(itemName,words)+'</td>';fragment.appendChild(tr)});resultsBodyEl.appendChild(fragment);if(total>displayedCount){loadMoreBtn.style.display='inline-flex';loadMoreBtn.textContent='عرض المزيد ('+shown.toLocaleString('en-US')+' من '+total.toLocaleString('en-US')+')'}else loadMoreBtn.style.display='none'}
    function exportResults(){if(!lastResults.length)return;const rows=[['المستودع','الكمية','الصنف']];lastResults.forEach(row=>rows.push([String(row[colMap.warehouse]??''),row[colMap.qty],String(row[colMap.item]??'')]));const worksheet=XLSX.utils.aoa_to_sheet(rows);const workbook=XLSX.utils.book_new();XLSX.utils.book_append_sheet(workbook,worksheet,'الأصناف');XLSX.writeFile(workbook,'نتائج_الأصناف.xlsx')}
    function showTempMessage(button,message){const original=button.dataset.originalText||button.textContent;button.dataset.originalText=original;button.textContent=message;setTimeout(()=>button.textContent=original,1500)}
    function copyResults(){if(!lastResults.length)return;const text=lastResults.map(row=>String(row[colMap.warehouse]??'')+'\t'+formatQty(row[colMap.qty])+'\t'+String(row[colMap.item]??'')).join('\n');if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(()=>showTempMessage(copyBtn,'تم النسخ')).catch(()=>showTempMessage(copyBtn,'تعذر النسخ'));else showTempMessage(copyBtn,'تعذر النسخ')}
    function printResults(){if(!lastResults.length)return;const savedCount=displayedCount;displayedCount=lastResults.length;search();const restore=()=>{displayedCount=savedCount;search();window.removeEventListener('afterprint',restore)};window.addEventListener('afterprint',restore);window.print()}
    function toggleInlineClearBtn(){inlineClearBtn.style.display=searchAllEl.value?'flex':'none'}
    function hideAutocomplete(){autocompleteEl.style.display='none';autocompleteEl.innerHTML='';autocompleteVisible=false;searchAllEl.setAttribute('aria-expanded','false')}
    function renderAutocomplete(list){if(!list.length){hideAutocomplete();return}autocompleteEl.innerHTML=list.map(name=>'<li role="option" tabindex="-1">'+escapeHtml(name)+'</li>').join('');autocompleteEl.style.display='block';autocompleteVisible=true;searchAllEl.setAttribute('aria-expanded','true')}
    function updateAutocomplete(){const raw=searchAllEl.value.trim();if(!raw||itemNamesList.length===0){hideAutocomplete();return}const norm=normalizeArabic(raw);const words=norm.split(/\s+/).filter(Boolean);const matches=[];for(let i=0;i<itemNamesList.length&&matches.length<8;i++){const entry=itemNamesList[i];if(words.every(w=>entry.norm.includes(w)))matches.push(entry.raw)}renderAutocomplete(matches)}
    function loadHistory(){try{searchHistory=JSON.parse(localStorage.getItem(HISTORY_KEY));if(!Array.isArray(searchHistory))searchHistory=[]}catch(error){searchHistory=[]}renderHistory()}
    function saveSearchToHistory(term){const trimmed=term.trim();if(!trimmed)return;searchHistory=searchHistory.filter(t=>t!==trimmed);searchHistory.unshift(trimmed);searchHistory=searchHistory.slice(0,5);try{localStorage.setItem(HISTORY_KEY,JSON.stringify(searchHistory))}catch(error){}renderHistory()}
    function renderHistory(){if(!searchHistory.length){historyRowEl.style.display='none';return}historyRowEl.style.display='flex';historyRowEl.innerHTML='<span class="history-label">عمليات بحث سابقة:</span>'+searchHistory.map(term=>'<button type="button" class="history-chip">'+escapeHtml(term)+'</button>').join('')}
    searchAllEl.addEventListener('input',()=>{saveQuery();toggleInlineClearBtn();clearTimeout(searchDebounceTimer);searchDebounceTimer=setTimeout(()=>{resetDisplayCount();updateAutocomplete();search()},SEARCH_DEBOUNCE_MS)});
    searchAllEl.addEventListener('keydown',event=>{if(event.key==='Enter'){clearTimeout(searchDebounceTimer);resetDisplayCount();hideAutocomplete();search();saveSearchToHistory(searchAllEl.value)}else if(event.key==='Escape'){if(autocompleteVisible)hideAutocomplete();else clearQuery()}});
    inlineClearBtn.addEventListener('click',()=>{searchAllEl.value='';toggleInlineClearBtn();saveQuery();hideAutocomplete();resetDisplayCount();search();searchAllEl.focus()});
    autocompleteEl.addEventListener('click',event=>{const li=event.target.closest('li');if(!li)return;searchAllEl.value=li.textContent;toggleInlineClearBtn();saveQuery();hideAutocomplete();resetDisplayCount();search();saveSearchToHistory(searchAllEl.value);searchAllEl.focus()});
    document.addEventListener('click',event=>{if(!autocompleteEl.contains(event.target)&&event.target!==searchAllEl)hideAutocomplete()});
    warehouseSelectEl.addEventListener('change',()=>{saveQuery();resetDisplayCount();search()});
    historyRowEl.addEventListener('click',event=>{const chip=event.target.closest('.history-chip');if(!chip)return;searchAllEl.value=chip.textContent;toggleInlineClearBtn();saveQuery();hideAutocomplete();resetDisplayCount();search()});
    clearBtn.addEventListener('click',clearQuery);exportBtn.addEventListener('click',exportResults);copyBtn.addEventListener('click',copyResults);printBtn.addEventListener('click',printResults);loadMoreBtn.addEventListener('click',()=>{displayedCount+=DISPLAY_STEP;search()});refreshBtn.addEventListener('click',loadExcel);
    document.querySelectorAll('#results th').forEach(th=>{th.setAttribute('aria-label',th.textContent.trim());const triggerSort=()=>{const col=th.getAttribute('data-col');if(currentSort.col===col)currentSort.dir*=-1;else{currentSort.col=col;currentSort.dir=1}document.querySelectorAll('#results th .arrow').forEach(arrow=>arrow.textContent='');th.querySelector('.arrow').textContent=currentSort.dir===1?'▲':'▼';search()};th.addEventListener('click',triggerSort);th.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();triggerSort()}})});
    restoreLastQuery();toggleInlineClearBtn();loadHistory();loadExcel();
  </script>
</body>
</html>
